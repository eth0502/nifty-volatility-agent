
name: Telegram Connection Test

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Test Message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not token or not chat_id:
              raise SystemExit("ERROR: Missing Telegram secrets")

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = json.dumps({
              "chat_id": chat_id,
              "text": "✅ Nifty Volatility Agent: Telegram connection successful!"
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if not result.get("ok"):
                  raise SystemExit("ERROR: Telegram API rejected the message")

              print("SUCCESS: Telegram message sent!")

          except urllib.error.HTTPError as error:
              print("Telegram API HTTP error:", error.code)
              raise SystemExit(1)

          except Exception as error:
              print("Telegram connection error:", str(error))
              raise SystemExit(1)
          PY
